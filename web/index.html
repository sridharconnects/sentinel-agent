<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sentinel-agent — live briefing</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b1020; color: #e6ecff; margin: 0; padding: 24px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: 8px; margin: 16px 0; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334; background: #141b33; color: #e6ecff; }
  button { padding: 10px 18px; border-radius: 8px; border: 0; background: #4f7cff; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  #nodes { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .node { padding: 6px 12px; border-radius: 20px; background: #1a2340; font-size: .85rem; }
  .node.active { background: #4f7cff; }
  .node.done { background: #1f9d55; }
  #out { white-space: pre-wrap; background: #10162c; border: 1px solid #263; border-radius: 10px; padding: 16px; min-height: 200px; }
  .err { color: #ff8080; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛰️ sentinel-agent — real-time intel briefing</h1>
  <form id="f">
    <input id="q" placeholder="Ask a research question…" value="What are the latest developments in agentic AI evaluation?">
    <button type="submit" id="go">Brief me</button>
  </form>
  <div id="nodes"></div>
  <div id="out">Your briefing will stream here…</div>
</div>
<script>
const NODES = ["supervisor", "researcher", "analyst", "critic", "finalizer"];
const nodesEl = document.getElementById("nodes");
const outEl = document.getElementById("out");
const goBtn = document.getElementById("go");

function renderNodes(state) {
  nodesEl.innerHTML = NODES.map(n => {
    const cls = state[n] === "active" ? "active" : state[n] === "done" ? "done" : "";
    return `<span class="node ${cls}">${n}</span>`;
  }).join("");
}

document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  goBtn.disabled = true;
  const nodeState = {};
  renderNodes(nodeState);
  outEl.textContent = "";
  let draft = "", finalText = "";
  const es = new EventSource("/stream?question=" + encodeURIComponent(q));
  es.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === "node_start") { nodeState[ev.node] = "active"; renderNodes(nodeState); }
    if (ev.type === "node_end" || ev.type === "guardrail") { nodeState[ev.node] = "done"; renderNodes(nodeState); }
    if (ev.type === "token" && ev.node === "analyst") { draft += ev.data.token; outEl.textContent = draft; }
    if (ev.type === "token" && ev.node === "finalizer") { finalText += ev.data.token; }
    if (ev.type === "tool_call") { outEl.textContent += `\n🔎 searching: ${ev.data.args.query}\n`; }
    if (ev.type === "guardrail") { outEl.textContent += `\n⚠️ guardrail: ${ev.data.action}\n`; }
    if (ev.type === "error") {
      outEl.innerHTML += `\n<span class="err">Error (${ev.data.reason})</span>`;
      es.close(); goBtn.disabled = false;
    }
    if (ev.type === "done") {
      if (finalText) outEl.textContent = finalText;
      outEl.textContent += `\n\n— revisions: ${ev.data.revision_count}, critic passed: ${ev.data.critic_passed}`;
      es.close(); goBtn.disabled = false;
    }
  };
  es.onerror = () => { outEl.innerHTML += `\n<span class="err">Stream connection failed.</span>`; es.close(); goBtn.disabled = false; };
});
</script>
</body>
</html>
